name: Build and publish Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release-v7.11
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Load the distribution Desktop OAuth client
        shell: pwsh
        env:
          DISTRIBUTION_OAUTH_JSON: ${{ secrets.GOOGLE_DESKTOP_OAUTH_JSON }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DISTRIBUTION_OAUTH_JSON)) {
            throw 'Missing GOOGLE_DESKTOP_OAUTH_JSON. Add the real distribution Desktop OAuth client as a repository Actions secret.'
          }
          [System.IO.File]::WriteAllText((Join-Path $PWD 'credentials.json'), $env:DISTRIBUTION_OAUTH_JSON, [System.Text.UTF8Encoding]::new($false))

      - name: Set up Python 3.10 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          architecture: x64

      - name: Validate inputs and install build dependencies
        shell: pwsh
        run: |
          python validate_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and verify the standalone Windows app
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean HotspotsFinder.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python verify_windows_build.py --smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows downloads
        shell: pwsh
        run: ./package_release.ps1

      - name: Publish and verify the Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python publish_windows_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Remove build-time OAuth file
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath credentials.json -Force -ErrorAction SilentlyContinue
